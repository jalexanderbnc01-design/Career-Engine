kind = "web"
previewPath = "/"
title = "XELIME Career Engine"
description = "A personal career command center for tracking verified skills and work experience, evaluating opportunities, building application materials, developing a portfolio, and planning professional growth."
version = "1.0.0"
id = "artifacts/career-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21482

[services.development]
run = "pnpm --filter @workspace/career-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/career-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21482"
BASE_PATH = "/"
